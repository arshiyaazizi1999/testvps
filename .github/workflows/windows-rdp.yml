
name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # 48 hours = 2880 minutes
    timeout-minutes: 2880

    steps:

      # =========================================================
      # 1. Enable Remote Desktop
      # =========================================================
      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          # Enable Remote Desktop Firewall rules
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Allow RDP authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

          # Disable RDP idle/session timeout policies
          New-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name "MaxIdleTime" `
            -PropertyType DWord `
            -Value 0 `
            -Force

          New-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name "MaxDisconnectionTime" `
            -PropertyType DWord `
            -Value 0 `
            -Force

          New-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name "MaxConnectionTime" `
            -PropertyType DWord `
            -Value 0 `
            -Force

          Write-Host "RDP enabled."

      # =========================================================
      # 2. Create Administrator Account
      # =========================================================
      - name: 2. Create Admin Account
        shell: powershell
        run: |
          $Username = "Azizi"
          $Password = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force

          # Create user if it doesn't already exist
          if (-not (Get-LocalUser -Name $Username -ErrorAction SilentlyContinue)) {

              New-LocalUser `
                -Name $Username `
                -Password $Password `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description "RDP Administrator"

              Write-Host "User $Username created."

          } else {

              Write-Host "User $Username already exists."

              Set-LocalUser `
                -Name $Username `
                -Password $Password
          }

          # Add to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host "User added to Administrators."

      # =========================================================
      # 3. Install Tailscale
      # =========================================================
      - name: 3. Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |

          Write-Host "Downloading Tailscale..."

          $Installer = "C:\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$Installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 10

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed successfully."

          # =====================================================
          # Connect Tailscale
          # =====================================================

          Write-Host "Connecting to Tailscale..."

          & $Tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server" `
            --unattended=true

          Start-Sleep -Seconds 10

          # =====================================================
          # Get Tailscale IP
          # =====================================================

          $ts_ip = (& $Tailscale ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ts_ip)) {
              Write-Error "Could not obtain Tailscale IP."
              exit 1
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "          WINDOWS RDP SERVER READY" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Username     : Azizi" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "Connect using Windows Remote Desktop:"
          Write-Host ""
          Write-Host "    mstsc.exe" -ForegroundColor Magenta
          Write-Host ""
          Write-Host "Then enter:"
          Write-Host "    $ts_ip" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Server will stay alive for up to 48 hours."
          Write-Host "==================================================" -ForegroundColor Green

      # =========================================================
      # 4. Verify RDP + Tailscale
      # =========================================================
      - name: 4. Verify Server
        shell: powershell
        run: |

          Write-Host "Checking RDP service..."

          $RDPService = Get-Service -Name TermService

          if ($RDPService.Status -ne "Running") {
              Start-Service TermService
          }

          Write-Host "RDP service: $((Get-Service TermService).Status)"

          Write-Host ""
          Write-Host "Checking Tailscale..."

          & "C:\Program Files\Tailscale\tailscale.exe" status

          Write-Host ""
          Write-Host "Tailscale IP:"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      # =========================================================
      # 5. Keep Windows Runner Alive for 48 Hours
      # =========================================================
      - name: 5. Keep Server Alive - 48 Hours
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "        SERVER RUNNING FOR 48 HOURS"
          Write-Host "==================================================" -ForegroundColor Green

          # 48 hours = 2880 minutes
          for ($i = 1; $i -le 2880; $i++) {

              Start-Sleep -Seconds 60

              # Check Tailscale every 5 minutes
              if (($i % 5) -eq 0) {

                  Write-Host ""
                  Write-Host "[$i/2880] Server running..."

                  try {

                      $Status = & "C:\Program Files\Tailscale\tailscale.exe" status 2>&1

                      Write-Host "Tailscale status: OK"

                  }
                  catch {

                      Write-Host "Tailscale check failed. Attempting reconnect..."

                      & "C:\Program Files\Tailscale\tailscale.exe" up `
                        --authkey="$Env:TAILSCALE_AUTHKEY" `
                        --hostname="github-rdp-server" `
                        --unattended=true
                  }
              }
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Yellow
          Write-Host "48 HOURS COMPLETED"
          Write-Host "GitHub runner will now terminate."
          Write-Host "==================================================" -ForegroundColor Yellow

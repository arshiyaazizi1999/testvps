
name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # 48 hours
    timeout-minutes: 2880

    steps:

      # =========================================================
      # 1. Enable Remote Desktop
      # =========================================================
      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

          # Disable RDP idle timeout
          New-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name "MaxIdleTime" `
            -PropertyType DWord `
            -Value 0 `
            -Force

          # Disable disconnected session timeout
          New-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name "MaxDisconnectionTime" `
            -PropertyType DWord `
            -Value 0 `
            -Force

          # Disable maximum connection time
          New-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name "MaxConnectionTime" `
            -PropertyType DWord `
            -Value 0 `
            -Force

          # Make sure RDP service is running
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP enabled successfully."

      # =========================================================
      # 2. Create Admin Account
      # =========================================================
      - name: 2. Create Admin Account
        shell: powershell
        run: |
          $Username = "Azizi"
          $PlainPassword = "Azizistore@123"

          Write-Host "Creating user: $Username"

          # Convert password
          $Password = ConvertTo-SecureString `
            $PlainPassword `
            -AsPlainText `
            -Force

          # Check whether user exists
          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $ExistingUser) {

              New-LocalUser `
                -Name $Username `
                -Password $Password `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description "RDP Administrator"

              Write-Host "User created successfully."

          } else {

              Write-Host "User already exists."
              Write-Host "Updating password..."

              Set-LocalUser `
                -Name $Username `
                -Password $Password
          }

          # Add to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          # Make sure account is enabled
          Enable-LocalUser -Name $Username

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP USER READY"
          Write-Host "========================================"
          Write-Host "Username: Azizi"
          Write-Host "Password: Azizistore@123"
          Write-Host "========================================"

      # =========================================================
      # 3. Install Tailscale
      # =========================================================
      - name: 3. Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |

          Write-Host "Downloading Tailscale..."

          $Installer = "C:\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$Installer`" /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 10

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed."

          # Check auth key
          if ([string]::IsNullOrWhiteSpace($Env:TAILSCALE_AUTHKEY)) {
              Write-Error "TAILSCALE_AUTHKEY GitHub Secret is empty or missing."
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $Tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server" `
            --unattended=true

          Start-Sleep -Seconds 10

          # Get IPv4
          $ts_ip = (& $Tailscale ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ts_ip)) {
              Write-Error "Could not obtain Tailscale IP."
              exit 1
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "             WINDOWS RDP READY" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Username     : Azizi" -ForegroundColor Yellow
          Write-Host "Password     : Azizistore@123" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "Open Remote Desktop (mstsc.exe)"
          Write-Host ""
          Write-Host "Connect to:"
          Write-Host "$ts_ip" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green

      # =========================================================
      # 4. Verify RDP and Tailscale
      # =========================================================
      - name: 4. Verify Server
        shell: powershell
        run: |

          Write-Host "Checking RDP service..."

          $RDPService = Get-Service -Name TermService

          if ($RDPService.Status -ne "Running") {
              Start-Service -Name TermService
          }

          Write-Host "RDP Service:"
          Get-Service -Name TermService

          Write-Host ""
          Write-Host "Checking Tailscale..."

          & "C:\Program Files\Tailscale\tailscale.exe" status

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      # =========================================================
      # 5. Keep Server Alive - 48 Hours
      # =========================================================
      - name: 5. Keep Server Alive - 48 Hours
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "        SERVER RUNNING FOR 48 HOURS" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green

          # 2880 minutes = 48 hours
          for ($i = 1; $i -le 2880; $i++) {

              Start-Sleep -Seconds 60

              # Check every 5 minutes
              if (($i % 5) -eq 0) {

                  Write-Host ""
                  Write-Host "[$i/2880] Server running..."

                  try {

                      $Status = & `
                        "C:\Program Files\Tailscale\tailscale.exe" `
                        status 2>&1

                      Write-Host "Tailscale is running."

                  }
                  catch {

                      Write-Host "Tailscale check failed."
                      Write-Host "Trying to reconnect..."

                      & `
                        "C:\Program Files\Tailscale\tailscale.exe" `
                        up `
                        --authkey="$Env:TAILSCALE_AUTHKEY" `
                        --hostname="github-rdp-server" `
                        --unattended=true
                  }
              }
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Yellow
          Write-Host "              48 HOURS COMPLETED" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Yellow
